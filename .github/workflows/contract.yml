name: Contract

# Both backends must satisfy contracts/openapi.yaml whenever either changes.
on:
  push:
    branches: [main]
    paths: ["contracts/**", "django/**", "fastapi/**", "tests/contract/**", "scripts/contract-check.sh", ".github/workflows/contract.yml"]
  pull_request:
    paths: ["contracts/**", "django/**", "fastapi/**", "tests/contract/**", "scripts/contract-check.sh", ".github/workflows/contract.yml"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reference
          POSTGRES_PASSWORD: reference
          POSTGRES_DB: django_reference
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U reference" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Create the FastAPI database
        run: PGPASSWORD=reference psql -h localhost -p 5433 -U reference -c 'CREATE DATABASE fastapi_reference'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make setup-django setup-fastapi setup-contract PYTHON=python
      - run: make check-contract
