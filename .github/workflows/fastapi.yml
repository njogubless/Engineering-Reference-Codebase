name: FastAPI

on:
  push:
    branches: [main]
    paths: ["fastapi/**", "contracts/**", "Makefile", ".github/workflows/fastapi.yml"]
  pull_request:
    paths: ["fastapi/**", "contracts/**", "Makefile", ".github/workflows/fastapi.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reference
          POSTGRES_PASSWORD: reference
          POSTGRES_DB: fastapi_reference
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U reference" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/reference_api/requirements*.txt
      - run: make setup-fastapi PYTHON=python
      - run: make check-fastapi
      - name: Audit dependencies for known vulnerabilities
        run: cd fastapi/reference_api && .venv/bin/pip-audit -r requirements.txt --require-hashes
