name: Firebase emulator tests

# Backend verification of real Firebase ID tokens (Auth emulator).
on:
  push:
    branches: [main]
    paths: ["firebase/**", "django/**", "fastapi/**", "Makefile", ".github/workflows/firebase.yml"]
  pull_request:
    paths: ["firebase/**", "django/**", "fastapi/**", "Makefile", ".github/workflows/firebase.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reference
          POSTGRES_PASSWORD: reference
          POSTGRES_DB: django_reference
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U reference" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4  # the Firestore emulator (Phase 3c) runs on the JVM
        with:
          distribution: temurin
          java-version: "21"
      - run: make setup-django setup-fastapi PYTHON=python
      - run: make check-firebase
